name: Bug report
description: Report a reproducible problem.
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and expected behavior.
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Tool and browser
      placeholder: Image Studio, Firefox on Windows
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
